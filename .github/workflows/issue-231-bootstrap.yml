name: Issue 231 inset hardening bootstrap

on:
  push:
    branches:
      - fix-inset-touch-pointer-events

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-inset-touch-pointer-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: node scripts/issue-231-inset-hardening.mjs
      - run: npm run maps:generate
      - run: npm test
      - name: Remove temporary diagnostics and bootstrap
        run: |
          git rm tests/browser/inset-hit-debug.spec.ts
          git rm scripts/issue-231-inset-hardening.mjs
          git rm .github/workflows/issue-231-bootstrap.yml
      - name: Commit generated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden true-scale inset touch surfaces"
          git push origin HEAD:fix-inset-touch-pointer-events
