name: Issue 198 acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'issue-198-spatial-scope-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact production artifact
        run: npm run build
      - name: Spatial scope selection exact-production matrix
        run: >-
          npx playwright test
          tests/browser/spatial-scope-selection.spec.ts
          --project=chromium
      - name: Upload rendered scope-selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-198-rendered-scope-selection
          path: test-results/issue-198/*.png
          if-no-files-found: error
      - name: Mobile Chromium regression
        run: >-
          npx playwright test
          tests/browser/spatial-scope-selection.spec.ts
          --project=mobile-chromium
