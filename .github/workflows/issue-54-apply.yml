name: Apply Issue 54 cartography migration

on:
  push:
    branches:
      - issue-54-remove-rivers
    paths:
      - scripts/issue-54-apply.mjs
      - .github/workflows/issue-54-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-54-remove-rivers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply source migration
        run: node scripts/issue-54-apply.mjs
      - name: Regenerate canonical map assets
        run: npm run maps:generate
      - name: Typecheck
        run: npm run check
      - name: Full verification
        run: npm test
      - name: Inspect no-river production contract
        run: |
          ! grep -R "map-water--rivers\|launcher-map-water--rivers\|runtime-major-rivers" dist src/data/maps/africa.ts
          grep -q "flag-atlas-v18" dist/sw.js
      - name: Commit implementation
        run: |
          rm scripts/issue-54-apply.mjs .github/workflows/issue-54-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/domain/map-models.ts scripts/map-sources/natural-earth.json scripts/generate-maps.mjs scripts/optimize-map-runtime.mjs src/data/maps/africa.ts src/ui/components/map.ts src/ui/components/neighbor-map.ts src/ui/components/launcher-map.ts atlas-theme.css map-cartography.css styles.css scripts/verify-cartography.mjs scripts/verify-map-contrast.mjs docs/architecture/cartography.md docs/architecture/cartography-provenance.json public/sw.js scripts/issue-54-apply.mjs .github/workflows/issue-54-apply.yml
          git diff --cached --check
          git commit -m "Remove rivers from Atlas runtime maps"
          git push origin HEAD:issue-54-remove-rivers
