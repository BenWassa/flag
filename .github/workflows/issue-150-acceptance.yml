name: Issue 150 implementation and acceptance

on:
  push:
    branches:
      - issue-150-motion-control-tokens

permissions:
  contents: write

jobs:
  acceptance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-150-motion-control-tokens
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run check
      - name: Static design-token drift verification
        run: node scripts/verify-design-tokens.mjs
      - name: Full repository gate
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exact-production design token browser regression
        run: npx playwright test tests/browser/design-token-regression.spec.ts tests/browser/locations-reduced-motion.spec.ts --project=chromium --project=mobile-chromium
      - name: PWA runtime regression
        run: npm run test:pwa-runtime
      - name: Inspect exact production artifact
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          grep -R -- '--control-height-compact:44px' dist/*.css
          grep -R -- '--control-height-standard:52px' dist/*.css
          grep -R -- '--motion-feedback-emphasis:520ms' dist/*.css
          find dist -maxdepth 2 -type f -printf '%P %s bytes\n' | sort | tail -n 80
      - name: Remove temporary issue 150 machinery
        if: success()
        run: |
          rm .github/workflows/issue-150-acceptance.yml scripts/issue-150-apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/issue-150-acceptance.yml scripts/issue-150-apply.py
          git commit -m 'Remove issue 150 acceptance machinery'
          git push origin HEAD:issue-150-motion-control-tokens
