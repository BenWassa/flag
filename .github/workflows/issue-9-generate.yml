name: Issue 9 map data generation

on:
  push:
    branches:
      - agent/issue-9-production-cartography
    paths:
      - .github/workflows/issue-9-generate.yml
      - package.json
      - scripts/generate-maps.mjs
      - scripts/map-sources/natural-earth.json

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[generated-map]') && !contains(github.event.head_commit.message, '[generator-failure]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate pinned cartography
        id: generate
        shell: bash
        run: |
          set +e
          npm run maps:generate -- --update-hashes > /tmp/issue9-generator.log 2>&1
          status=$?
          cat /tmp/issue9-generator.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            cp /tmp/issue9-generator.log docs/ISSUE_9_GENERATOR_FAILURE.txt
          fi
          exit 0
      - name: Commit generated cartography
        if: steps.generate.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json scripts/map-sources/natural-earth.json src/data/maps/africa.ts docs/CARTOGRAPHY_PROVENANCE.json
          if git diff --cached --quiet; then
            echo "Generated map data is already current."
            exit 0
          fi
          git commit -m "chore: generate pinned Africa cartography [generated-map]"
          git push
      - name: Publish generator failure
        if: steps.generate.outputs.status != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ISSUE_9_GENERATOR_FAILURE.txt
          git commit -m "docs: capture map generator failure [generator-failure]"
          git push
          exit 1
