name: Issue 146 spatial mastery acceptance

on:
  push:
    branches: [issue-146-spatial-mastery-semantics]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-146-spatial-mastery-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Exact-production accessibility and layout acceptance
        run: npx playwright test tests/browser/navigation-mastery.spec.ts tests/browser/spatial-atlas.spec.ts tests/browser/world-crown.spec.ts --project=chromium --project=mobile-chromium
      - name: Inspect exact artifact
        run: |
          npm run build
          grep -F 'region-row--mastered' dist/atlas-theme.css >/dev/null
          grep -F 'region-row__state' dist/atlas-theme.css >/dev/null
          grep -F 'aria-labelledby' dist/app.js >/dev/null
          ! grep -F 'aria-label="Play West Africa"' dist/app.js
          test -f dist/sw.js
      - name: Remove temporary acceptance workflow
        run: |
          rm -f .github/workflows/issue-146-acceptance.yml
          rm -f tests/firebase/firestore-debug.log firestore-debug.log tests/firebase/package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(#146): remove acceptance workflow"
          git push origin HEAD:issue-146-spatial-mastery-semantics
