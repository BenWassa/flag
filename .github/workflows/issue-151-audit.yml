name: Issue 151 execution

on:
  pull_request:
    branches: [main]

actions: {}

permissions:
  contents: write

jobs:
  execute:
    if: github.event.pull_request.head.ref == 'issue-151-retired-css-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-151-retired-css-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Capture pre-change selector and exact-build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/open
          npm run build
          {
            echo '# Issue #151 selector audit (temporary execution evidence)'
            echo
            echo "Branch parent baseline: $(git merge-base HEAD origin/main)"
            echo "Audit head before production edits: $(git rev-parse HEAD)"
            echo
            echo '## Production TS/TSX hits before cleanup'
            git grep -nE 'progress-achievement-|mastery-list|ledger-|mini-ledger|filter-tab|status-chip--mastered|status-text--mastered|map-viewport-control|test-advance|text-icon-button|launcher-header__badge|screen-title__row' -- 'src/**/*.ts' 'src/**/*.tsx' || true
            echo
            echo '## Stylesheet hits before cleanup'
            git grep -nE 'progress-achievement-|mastery-list|ledger-|mini-ledger|filter-tab|status-chip--mastered|status-text--mastered|map-viewport-control|test-advance|text-icon-button|launcher-header__badge|screen-title__row' -- 'src/styles/*.css' || true
            echo
            echo '## Exact dist non-CSS hits before cleanup'
            find dist -type f ! -name '*.css' -print0 | xargs -0 grep -nE 'progress-achievement-|mastery-list|ledger-|mini-ledger|filter-tab|status-chip--mastered|status-text--mastered|map-viewport-control|test-advance|text-icon-button|launcher-header__badge|screen-title__row' || true
            echo
            echo '## Fallback classes intentionally retained'
            git grep -nE 'launcher-header__icon|launcher__scope-list|launcher__learn|page--launcher' -- src/react/components/Launcher.tsx src/styles/*.css || true
          } > docs/open/issue-151-selector-audit.txt
      - name: Apply focused CSS cleanup
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import postcss from 'postcss';

          const styleDir = 'src/styles';
          const retired = [
            /\.progress-achievement(?:[-_][A-Za-z0-9_-]*)?/,
            /\.mastery-list\b/,
            /\.ledger-[A-Za-z0-9_-]+\b/,
            /\.mini-ledger[A-Za-z0-9_-]*\b/,
            /\.filter-tab[A-Za-z0-9_-]*\b/,
            /\.status-chip--mastered\b/,
            /\.status-text--mastered\b/,
            /\.map-viewport-control[A-Za-z0-9_-]*\b/,
            /\.test-advance\b/,
            /\.launcher-header__badge\b/,
            /\.screen-title__row\b/,
            /\.text-icon-button\b/,
          ];

          for (const name of fs.readdirSync(styleDir).filter((file) => file.endsWith('.css'))) {
            const file = path.join(styleDir, name);
            const source = fs.readFileSync(file, 'utf8');
            const root = postcss.parse(source, { from: file });
            root.walkRules((rule) => {
              const selectors = rule.selectors;
              const kept = selectors.filter((selector) => !retired.some((pattern) => pattern.test(selector)));
              if (kept.length === selectors.length) return;
              if (kept.length === 0) rule.remove();
              else rule.selectors = kept;
            });
            root.walkComments((comment) => {
              if (comment.text.includes('Placeholder slot only')) comment.remove();
            });

            if (name === 'styles.css') {
              let anchor;
              root.walkRules((rule) => {
                if (!anchor && rule.selector?.trim() === '.icon-button') anchor = rule;
              });
              if (!anchor) throw new Error('Expected .icon-button anchor in styles.css');
              const canonical = postcss.parse(`
.text-icon-button {
  min-width: 44px;
  min-height: 44px;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border-radius: var(--radius-md);
  padding: 0 13px;
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 650;
  background: var(--surface);
  box-shadow: 0 1px 2px rgba(16, 19, 24, .035);
}
.text-icon-button:active {
  transform: translateY(1px);
  background: var(--surface-subtle);
}
`);
              anchor.after(...canonical.nodes);
            }

            const output = root.toString();
            if (output !== source) fs.writeFileSync(file, output);
          }

          const launcherPath = 'src/react/components/Launcher.tsx';
          const launcher = fs.readFileSync(launcherPath, 'utf8');
          const before = '          <span className="screen-title__row"><h1 tabIndex={-1} data-autofocus aria-label={`${activeScope.label} ${domainName} launcher`}>{activeScope.label}</h1><span className="launcher-header__badge" aria-hidden="true" /></span>';
          const after = '          <h1 tabIndex={-1} data-autofocus aria-label={`${activeScope.label} ${domainName} launcher`}>{activeScope.label}</h1>';
          if (!launcher.includes(before) && !launcher.includes(after)) throw new Error('Launcher header markup no longer matches #151 audit target');
          if (launcher.includes(before)) fs.writeFileSync(launcherPath, launcher.replace(before, after));
          NODE
      - name: Assert focused source result
        shell: bash
        run: |
          set -euo pipefail
          retired='progress-achievement-|mastery-list|ledger-|mini-ledger|filter-tab|status-chip--mastered|status-text--mastered|map-viewport-control|test-advance|launcher-header__badge|screen-title__row'
          if git grep -nE "$retired" -- 'src/**/*.ts' 'src/**/*.tsx' 'src/styles/*.css'; then
            echo 'Retired selector or hook remains in production source.' >&2
            exit 1
          fi
          test "$(git grep -l 'text-icon-button' -- 'src/styles/*.css' | wc -l)" -eq 1
          test "$(git grep -n '^\.text-icon-button {' -- src/styles/styles.css | wc -l)" -eq 1
          test "$(git grep -n '^\.text-icon-button:active {' -- src/styles/styles.css | wc -l)" -eq 1
          git grep -nE 'launcher-header__icon|launcher__scope-list|launcher__learn|page--launcher' -- src/react/components/Launcher.tsx src/styles/*.css
      - name: Commit production cleanup and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No production cleanup diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/react/components/Launcher.tsx src/styles docs/open/issue-151-selector-audit.txt
          git commit -m 'refactor(#151): remove retired CSS ownership'
          git push origin HEAD:issue-151-retired-css-cleanup
