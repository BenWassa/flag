name: Issue 151 repair

on:
  push:
    branches: [issue-151-retired-css-cleanup]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-151-retired-css-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/issue-151-cleanup.mjs
      - name: Commit repaired production behaviour
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/issue-151-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/styles.css src/styles/atlas-theme.css src/styles/map-cartography.css
          git commit -m 'fix(#151): preserve consolidated control behaviour'
          git fetch origin issue-151-retired-css-cleanup
          git rebase origin/issue-151-retired-css-cleanup
          git push origin HEAD:issue-151-retired-css-cleanup
