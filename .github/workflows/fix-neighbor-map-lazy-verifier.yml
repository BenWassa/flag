name: Fix scope-aware Neighbours lazy-load verifier

on:
  push:
    branches: [issue-57-global-expansion-foundation]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Update scope-aware Neighbours lazy-load verifier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/fix-neighbor-map-lazy-verifier.mjs
      - run: rm .github/fix-neighbor-map-lazy-verifier.mjs .github/workflows/fix-neighbor-map-lazy-verifier.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-neighbor-map.mjs .github
          git commit -m "Update scope-aware Neighbours lazy-load verifier"
          git push
