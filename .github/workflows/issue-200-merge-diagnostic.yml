name: Issue 200 merge diagnostic

on:
  push:
    branches:
      - issue-200-spatial-marker-hit-parity

permissions:
  contents: read

jobs:
  merge-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Materialise merge with current main
        shell: bash
        run: |
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          git status --short > merge-status.txt
          git diff --name-only --diff-filter=U > merge-conflicts.txt
      - name: Archive merge workspace
        shell: bash
        run: tar --exclude=.git -czf issue-200-merge-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: issue-200-merge-workspace
          path: issue-200-merge-workspace.tar.gz
          if-no-files-found: error
