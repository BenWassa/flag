name: Reconcile Issue 57 with current architecture

on:
  push:
    branches: [issue-57-global-expansion-foundation]

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, 'Reconcile Issue 57 current architecture') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/reconcile-foundation.mjs
      - run: rm .github/reconcile-foundation.mjs .github/workflows/reconcile-foundation.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.ts scripts/verify-ia.mjs package.json .github
          git commit -m "Reconcile Issue 57 current architecture"
          git push
