name: Deploy Firebase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: firebase-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Read pinned Spatial Atlas preview source
        id: spatial-preview
        run: |
          sha="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("config/spatial-preview.json", "utf8")).sourceCommit)')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.spatial-preview.outputs.sha }}
          path: .spatial-preview-source
      - name: Build pinned Spatial Atlas preview
        working-directory: .spatial-preview-source
        run: npm ci && npm run build
      - name: Assemble combined deployment artifact
        run: npm run build:spatial-preview
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLAS_3C48A }}'
          channelId: live
          projectId: atlas-3c48a
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLAS_3C48A }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@latest deploy --only firestore:rules --project atlas-3c48a --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
      - name: Install Chromium for Firebase acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify live Firebase Hosting origin
        env:
          ATLAS_FIREBASE_ORIGIN: https://atlas-3c48a.web.app
        run: |
          set -o pipefail
          npx playwright test --config=playwright.firebase.config.ts 2>&1 | tee "$RUNNER_TEMP/firebase-acceptance.log"
          status=${PIPESTATUS[0]}
          {
            echo '## Firebase Hosting acceptance'
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/firebase-acceptance.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
