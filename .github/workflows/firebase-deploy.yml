name: Deploy Firebase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: firebase-deploy
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      ATLAS_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ATLAS_BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Record exact production identity
        run: echo "Built Atlas ${ATLAS_BUILD_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLAS_3C48A }}'
          channelId: live
          projectId: atlas-3c48a
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATLAS_3C48A }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx firebase-tools@latest deploy --only firestore:rules --project atlas-3c48a --non-interactive
          rm -f "$RUNNER_TEMP/firebase-sa.json"
      - name: Install Chromium for Firebase acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify live Firebase Hosting origin
        env:
          ATLAS_FIREBASE_ORIGIN: https://atlas-3c48a.web.app
        run: |
          set -o pipefail
          npx playwright test --config=playwright.firebase.config.ts 2>&1 | tee "$RUNNER_TEMP/firebase-acceptance.log"
          status=${PIPESTATUS[0]}
          {
            echo '## Firebase Hosting acceptance'
            echo '```text'
            tail -n 160 "$RUNNER_TEMP/firebase-acceptance.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Verify identity and record Firebase cache policy
        env:
          ATLAS_FIREBASE_ORIGIN: https://atlas-3c48a.web.app
        run: |
          set -euo pipefail
          base="${ATLAS_FIREBASE_ORIGIN%/}/"
          index_body="$(curl -fsSL "$base")"
          printf '%s' "$index_body" | grep -Fq "name=\"atlas-build\" content=\"${ATLAS_BUILD_SHA}\""
          echo "Firebase live build identity: ${ATLAS_BUILD_SHA}"
          app_body="$(curl -fsSL "${base}app.js")"
          hashed="$(printf '%s' "$app_body" | grep -oE 'assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
          test -n "$hashed"
          headers() {
            curl -fsSL -D - -o /dev/null "$1" | tr -d '\r'
          }
          require_revalidation() {
            label="$1"
            url="$2"
            observed="$(headers "$url")"
            printf '%s\n' "$observed" | grep -Eiq '^cache-control:.*(no-cache|max-age=0|must-revalidate)'
            printf '\n### %s\n%s\n' "$label" "$observed"
            {
              echo "### ${label}"
              echo '```text'
              printf '%s\n' "$observed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          require_revalidation 'Firebase root/navigation' "$base"
          require_revalidation 'Firebase index.html' "${base}index.html"
          require_revalidation 'Firebase sw.js' "${base}sw.js"
          require_revalidation 'Firebase app.js' "${base}app.js"
          require_revalidation 'Firebase stable CSS' "${base}styles.css"
          hashed_headers="$(headers "${base}${hashed}")"
          printf '%s\n' "$hashed_headers" | grep -Eiq '^cache-control:.*immutable'
          printf '\n### Firebase representative hashed chunk\n%s\n' "$hashed_headers"
          {
            echo '### Firebase representative hashed chunk'
            echo '```text'
            printf '%s\n' "$hashed_headers"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
