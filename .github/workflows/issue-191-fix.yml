name: Issue 191 Focused Fix

on:
  push:
    branches: [issue-191-automatic-pwa-updates]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-191-automatic-pwa-updates
      - name: Correct failure-cache assertion and remove this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/browser/pwa-runtime.spec.ts')
          source = path.read_text()
          old = "    await expect.poll(() => cacheState(page)).toMatchObject({ names: expect.arrayContaining(['flag-atlas-runtime-v1']) });\n\n    await context.setOffline(true);"
          new = "    expect((await cacheState(page)).names.some((name) => name.startsWith('workbox-precache-v2-'))).toBe(true);\n\n    await context.setOffline(true);"
          before, matched, after = source.rpartition(old)
          if not matched:
              raise SystemExit('missing final failure-cache assertion')
          path.write_text(before + new + after)
          PY
          git rm .github/workflows/issue-191-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/browser/pwa-runtime.spec.ts
          git commit -m "test: assert preserved offline shell cache"
          git push origin HEAD:issue-191-automatic-pwa-updates
