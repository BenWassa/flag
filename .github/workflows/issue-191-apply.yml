name: Issue 191 Apply

on:
  push:
    branches: [issue-191-automatic-pwa-updates]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-191-automatic-pwa-updates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/issue-191-apply.mjs
      - name: Commit transformed source
        run: |
          if git diff --quiet -- src/react/AtlasApp.tsx; then
            echo "No transformation changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/react/AtlasApp.tsx
          git commit -m "feat: connect PWA updates to safe app boundaries"
          git push origin HEAD:issue-191-automatic-pwa-updates
