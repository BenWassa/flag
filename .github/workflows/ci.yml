name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  materialize-issue-9:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/issue-9-production-cartography' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run maps:generate -- --update-hashes
      - name: Commit generated cartography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json scripts/map-sources/natural-earth.json src/data/maps/africa.ts docs/CARTOGRAPHY_PROVENANCE.json
          if git diff --cached --quiet; then
            echo "Generated map data is already current."
            exit 0
          fi
          git commit -m "chore: generate pinned Africa cartography [generated-map]"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bootstrap pinned Issue 9 cartography
        run: npm run maps:generate -- --update-hashes
      - uses: actions/upload-artifact@v4
        with:
          name: issue-9-generated-cartography
          path: |
            package-lock.json
            scripts/map-sources/natural-earth.json
            src/data/maps/africa.ts
            docs/CARTOGRAPHY_PROVENANCE.json
          if-no-files-found: error
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flag-atlas-dist
          path: dist
          if-no-files-found: warn
