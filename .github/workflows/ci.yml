name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: flag-atlas-dist
          path: dist
          if-no-files-found: error

  pwa-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exact-production A to B PWA lifecycle
        run: npm run test:pwa-runtime
      - name: Exact-production Locations feedback geometry
        run: npx playwright test tests/browser/locations-feedback-geometry.spec.ts tests/browser/locations-reduced-motion.spec.ts --project=chromium
