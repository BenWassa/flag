name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Bootstrap pinned Issue 9 cartography
        run: npm run maps:generate -- --update-hashes
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: flag-atlas-dist
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: issue-9-generated-cartography
          path: |
            package-lock.json
            scripts/map-sources/natural-earth.json
            src/data/maps/africa.ts
            docs/CARTOGRAPHY_PROVENANCE.json
          if-no-files-found: error
