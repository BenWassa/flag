name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Read pinned Spatial Atlas preview source
        id: spatial-preview
        run: |
          sha="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("config/spatial-preview.json", "utf8")).sourceCommit)')"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.spatial-preview.outputs.sha }}
          path: .spatial-preview-source
      - name: Build pinned Spatial Atlas preview
        working-directory: .spatial-preview-source
        run: npm ci && npm run build
      - name: Assemble combined deployment artifact
        run: npm run build:spatial-preview
      - name: Install Chromium for deployed-preview acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify classic ↔ spatial deployed experience
        run: npm run test:spatial-deployment
      - uses: actions/upload-artifact@v4
        with:
          name: flag-atlas-dist
          path: dist
          if-no-files-found: error
