name: Harden Europe production geography

on:
  push:
    branches: [issue-25-europe-expansion]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'Hardened Europe production geography') && !contains(github.event.head_commit.message, 'Record Europe hardening failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply shared Europe hardening seams
        run: |
          python - <<'PY'
          from pathlib import Path

          config_path = Path('scripts/map-continent-configs.mjs')
          config = config_path.read_text()
          config = config.replace("  islandLocatorIds: Object.freeze(['MLT']),\n  callouts: Object.freeze({}),", """  islandLocatorIds: Object.freeze(['MLT']),
  precisionSensitiveCountryIds: Object.freeze(['AND', 'LIE', 'LUX', 'MCO', 'SMR', 'VAT', 'MLT']),
  wholeOutlineCountryIds: Object.freeze(['RUS', 'FRA', 'NOR']),
  callouts: Object.freeze({
    AND: Object.freeze({ dx: -28, dy: 18, r: 10 }),
    LIE: Object.freeze({ dx: 24, dy: -20, r: 10 }),
    LUX: Object.freeze({ dx: -25, dy: -20, r: 10 }),
    MCO: Object.freeze({ dx: 27, dy: 16, r: 10 }),
    SMR: Object.freeze({ dx: 24, dy: -16, r: 10 }),
    VAT: Object.freeze({ dx: -26, dy: 18, r: 10 }),
  }),""", 1)
          config = config.replace("  fitExcludeCountryIds: Object.freeze(['RUS']),\n  focusExcludeCountryIds: Object.freeze(['RUS']),", "  fitExcludeCountryIds: Object.freeze(['RUS', 'FRA', 'NOR']),\n  focusExcludeCountryIds: Object.freeze(['RUS', 'FRA', 'NOR']),", 1)
          config = config.replace("    russia: 'one canonical whole-country RUS geometry; excluded only from Europe viewport fit/focus so eastern geometry may crop at the canvas edge',", """    russia: 'one canonical whole-country RUS outline; map rendering is clipped to the Europe canvas and RUS is excluded only from fit/focus calculations',
    france: 'one canonical whole-country FRA outline including French Guiana; map rendering is clipped to the Europe canvas and FRA is excluded from fit/focus so overseas geometry does not distort Europe',
    norway: 'one canonical whole-country NOR outline; remote multipart source geometry is excluded from fit/focus while map rendering remains clipped to the Europe canvas',
    microstates: 'AND/LIE/LUX/MCO/SMR/VAT use explicit mainland callouts after phone-scale geometry audit; MLT uses the island locator; canonical outline geometry is retained',""", 1)
          config_path.write_text(config)

          core_path = Path('scripts/map-generation-core.mjs')
          core = core_path.read_text()
          core = core.replace("import { geoNaturalEarth1, geoPath } from 'd3-geo';", "import { geoIdentity, geoNaturalEarth1, geoPath } from 'd3-geo';", 1)
          core = core.replace("  const planarPath = geoPath().digits(PATH_DIGITS);", """  const planarPath = geoPath().digits(PATH_DIGITS);
  const clippedPlanarPath = geoPath(
    geoIdentity().clipExtent([[0, 0], [WIDTH, HEIGHT]]),
  ).digits(PATH_DIGITS);""", 1)
          old_loop = """  const islandLocators = new Set(config.islandLocatorIds ?? []);
  const geometry = {};
  for (const item of simplifiedCollection.features.filter((featureValue) => featureValue.properties?.countryId)) {
    const id = item.properties.countryId;
    const countryPath = planarPath(item);
    if (!countryPath) throw new Error(`Simplified topology projected ${id} to an empty path.`);
    const countryGeometry = { countryId: id };
    if (item.properties?.role === 'country' && islandLocators.has(id)) {
      const centroid = planarPath.centroid(item);
      countryGeometry.outlinePath = countryPath;
      countryGeometry.locator = {
        cx: Number(centroid[0].toFixed(2)),
        cy: Number(centroid[1].toFixed(2)),
        r: 7,
      };
    } else {
      countryGeometry.path = countryPath;
    }
    if (item.properties?.role === 'country') {
      const callout = calloutFor(config, id, planarPath.centroid(item));
      if (callout) countryGeometry.callout = callout;
    }
    geometry[id] = countryGeometry;
  }"""
          new_loop = """  const islandLocators = new Set(config.islandLocatorIds ?? []);
  const wholeOutlineIds = new Set(config.wholeOutlineCountryIds ?? []);
  const geometry = {};
  for (const item of simplifiedCollection.features.filter((featureValue) => featureValue.properties?.countryId)) {
    const id = item.properties.countryId;
    const fullCountryPath = planarPath(item);
    const countryPath = clippedPlanarPath(item);
    if (!fullCountryPath) throw new Error(`Simplified topology projected ${id} to an empty path.`);
    const countryGeometry = { countryId: id };
    if (item.properties?.role === 'country' && islandLocators.has(id)) {
      const centroid = planarPath.centroid(item);
      countryGeometry.outlinePath = fullCountryPath;
      countryGeometry.locator = {
        cx: Number(centroid[0].toFixed(2)),
        cy: Number(centroid[1].toFixed(2)),
        r: 7,
      };
    } else {
      if (countryPath) countryGeometry.path = countryPath;
      if (item.properties?.role === 'country' && wholeOutlineIds.has(id)) {
        countryGeometry.outlinePath = fullCountryPath;
      }
    }
    if (item.properties?.role === 'country') {
      const callout = calloutFor(config, id, planarPath.centroid(item));
      if (callout) countryGeometry.callout = callout;
    }
    geometry[id] = countryGeometry;
  }"""
          if old_loop not in core:
              raise SystemExit('country geometry loop marker not found')
          core = core.replace(old_loop, new_loop, 1)
          core = core.replace("  const contextPaths = contextFeatures.map((item) => planarPath(item)).filter(Boolean);", "  const contextPaths = contextFeatures.map((item) => clippedPlanarPath(item)).filter(Boolean);", 1)
          core = core.replace("  const sharedBoundaryPath = planarPath(sharedMesh);\n  const coastlinePath = planarPath(coastlineMesh);", "  const sharedBoundaryPath = clippedPlanarPath(sharedMesh);\n  const coastlinePath = clippedPlanarPath(coastlineMesh);", 1)
          core_path.write_text(core)

          optimizer_path = Path('scripts/optimize-map-runtime.mjs')
          optimizer = optimizer_path.read_text()
          optimizer = optimizer.replace("function formatNumber(value) {\n  const rounded = Number(value.toFixed(PATH_DIGITS));", "function formatNumber(value, digits = PATH_DIGITS) {\n  const rounded = Number(value.toFixed(digits));", 1)
          optimizer = optimizer.replace("function roundSvgPath(path) {\n  return path.replace(/-?\\d+(?:\\.\\d+)?/g, (value) => formatNumber(Number(value)));\n}", "function roundSvgPath(path, digits = PATH_DIGITS) {\n  return path.replace(/-?\\d+(?:\\.\\d+)?/g, (value) => formatNumber(Number(value), digits));\n}", 1)
          old_round = """  for (const item of Object.values(geometry)) {
    if (item.path) item.path = roundSvgPath(item.path);
    if (item.outlinePath) item.outlinePath = roundSvgPath(item.outlinePath);
  }"""
          new_round = """  const precisionSensitiveIds = new Set(config.precisionSensitiveCountryIds ?? []);
  for (const [countryId, item] of Object.entries(geometry)) {
    const digits = precisionSensitiveIds.has(countryId) ? 2 : PATH_DIGITS;
    if (item.path) item.path = roundSvgPath(item.path, digits);
    if (item.outlinePath) item.outlinePath = roundSvgPath(item.outlinePath, digits);
  }"""
          if old_round not in optimizer:
              raise SystemExit('runtime geometry rounding marker not found')
          optimizer = optimizer.replace(old_round, new_round, 1)
          optimizer = optimizer.replace("    physicalTolerance: { ...PHYSICAL_TOLERANCE },", "    physicalTolerance: { ...PHYSICAL_TOLERANCE },\n    precisionSensitiveCountryIds: [...precisionSensitiveIds],", 1)
          optimizer_path.write_text(optimizer)

          outline_path = Path('src/domain/outline.ts')
          outline = outline_path.read_text()
          outline = outline.replace('  const source = geometry.path ?? geometry.outlinePath;', '  const source = geometry.outlinePath ?? geometry.path;', 1)
          outline_path.write_text(outline)
          PY
      - name: Regenerate and inspect
        shell: bash
        run: |
          set +e
          npm run maps:generate 2>&1 | tee /tmp/europe-hardening.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp /tmp/europe-hardening.log docs/open/europe-hardening-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/open/europe-hardening-failure.log
            git commit -m "Record Europe hardening failure"
            git push
            exit "$status"
          fi
          npm run check
          npm run build
          node --input-type=module <<'NODE' | tee docs/open/europe-generation-inspection.txt
          import { readFile, stat } from 'node:fs/promises';
          import { gzipSync } from 'node:zlib';
          const map = await import('./dist/data/maps/europe.js');
          const geometry = map.EUROPE_GEOMETRY;
          const adjacency = map.EUROPE_LAND_ADJACENCY;
          const bounds = (path) => {
            const points = [...String(path ?? '').matchAll(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g)].map((m) => [Number(m[1]), Number(m[2])]);
            if (!points.length) return null;
            const xs = points.map((p) => p[0]); const ys = points.map((p) => p[1]);
            return { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys), width: Math.max(...xs)-Math.min(...xs), height: Math.max(...ys)-Math.min(...ys) };
          };
          const bytes = await readFile('dist/data/maps/europe.js');
          console.log('EUROPE_RUNTIME_BYTES', (await stat('dist/data/maps/europe.js')).size);
          console.log('EUROPE_RUNTIME_GZIP_BYTES', gzipSync(bytes, { level: 9 }).byteLength);
          console.log('EUROPE_GEOMETRY_IDS', Object.keys(geometry).join(','));
          console.log('EUROPE_CONTEXT_PATHS', map.EUROPE_EXTRA_CONTEXT_PATHS.length);
          console.log('EUROPE_LAKES', map.EUROPE_WATER.lakes.map((lake) => lake.name).join(','));
          console.log('EUROPE_FOCUS', JSON.stringify(map.EUROPE_SCOPE_FOCUS));
          for (const id of ['RUS','FRA','NOR','PRT','ESP','AND','LIE','LUX','MCO','SMR','VAT','MLT']) {
            const item = geometry[id];
            console.log(`EUROPE_GEOMETRY_${id}`, JSON.stringify({ mapBounds: bounds(item?.path), outlineBounds: bounds(item?.outlinePath ?? item?.path), locator: item?.locator ?? null, callout: item?.callout ?? null }));
          }
          for (const id of ['RUS','DEU','FRA','ITA','ESP','LIE','SMR','VAT','ISL','MLT']) console.log(`EUROPE_ADJ_${id}`, JSON.stringify(adjacency[id]));
          NODE
      - run: rm .github/workflows/harden-europe.yml
      - run: rm -f docs/open/europe-hardening-failure.log
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/map-continent-configs.mjs scripts/map-generation-core.mjs scripts/optimize-map-runtime.mjs src/domain/outline.ts src/data/maps src/data/neighbors docs/architecture docs/open/europe-generation-inspection.txt .github/workflows/harden-europe.yml
          git add -A docs/open/europe-hardening-failure.log
          git commit -m "Hardened Europe production geography"
          git push
