name: Generate Asia expansion cartography

on:
  push:
    branches:
      - issue-26-asia-middle-east-expansion

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Apply shared Asia expansion hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path('scripts/map-generation-core.mjs')
          source = core.read_text()

          patches = [
            (
              """  const beforePoints = normalized.features.reduce((sum, item) => sum + geometryCoordinateCount(item.geometry), 0);\n\n  const projection = geoNaturalEarth1().fitExtent(\n    [[PADDING, PADDING], [WIDTH - PADDING, HEIGHT - PADDING]],\n    normalized,\n  );\n""",
              """  const beforePoints = normalized.features.reduce((sum, item) => sum + geometryCoordinateCount(item.geometry), 0);\n\n  // Some cross-continent context is required for truthful rendering but is too\n  // geographically large to define the learner-continent camera extent. When\n  // a config opts in, only the named context countries participate in fitting;\n  // all context still renders through the same clipped projection afterwards.\n  const fitContextIds = config.fitContextCountryIds\n    ? new Set(config.fitContextCountryIds)\n    : null;\n  const projectionInput = fitContextIds\n    ? featureCollection(normalized.features.filter((item) =>\n        item.properties?.role !== 'context-country' || fitContextIds.has(item.properties?.countryId)))\n    : normalized;\n\n  const projection = geoNaturalEarth1().fitExtent(\n    [[PADDING, PADDING], [WIDTH - PADDING, HEIGHT - PADDING]],\n    projectionInput,\n  );\n""",
            ),
            (
              """  const adjacency = config.adjacencyMode === 'global'\n    ? sliceGlobalAdjacency(globalGraph.adjacency, scoredCatalog, globalGraph.representedIds, config)\n    : deriveLocalAdjacency(simplifiedTopology);\n""",
              """  const adjacencyCatalog = [...scoredCatalog];\n  for (const countryId of config.extraAdjacencyCountryIds ?? []) {\n    const row = catalog.find((item) => item.id === countryId);\n    if (!row) throw new Error(`Unknown extra adjacency country ${countryId} for ${config.displayName}.`);\n    if (!adjacencyCatalog.some((item) => item.id === countryId)) adjacencyCatalog.push(row);\n  }\n  const adjacency = config.adjacencyMode === 'global'\n    ? sliceGlobalAdjacency(globalGraph.adjacency, adjacencyCatalog, globalGraph.representedIds, config)\n    : deriveLocalAdjacency(simplifiedTopology);\n""",
            ),
            (
              """  const regionIds = new Map();\n  for (const row of scoredCatalog) {\n    const ids = regionIds.get(row.region) ?? [];\n    ids.push(row.id);\n    regionIds.set(row.region, ids);\n  }\n  for (const [region, ids] of [...regionIds.entries()].sort()) {\n    const regionFeatures = ids.map((id) => simplifiedById.get(id)).filter(Boolean);\n    scopeFocus[region] = boundsToFocus(planarPath.bounds(featureCollection(regionFeatures)));\n  }\n""",
              """  if (config.learningScopes) {\n    for (const scope of config.learningScopes) {\n      const scopeFeatures = scope.countryIds.map((id) => simplifiedById.get(id)).filter(Boolean);\n      if (scopeFeatures.length !== scope.countryIds.length) {\n        const represented = new Set(scopeFeatures.map((item) => item.properties?.countryId));\n        const missing = scope.countryIds.filter((id) => !represented.has(id));\n        throw new Error(`${config.displayName} scope ${scope.id} is missing generated geometry: ${missing.join(', ')}`);\n      }\n      scopeFocus[scope.id] = boundsToFocus(planarPath.bounds(featureCollection(scopeFeatures)));\n    }\n  } else {\n    const regionIds = new Map();\n    for (const row of scoredCatalog) {\n      const ids = regionIds.get(row.region) ?? [];\n      ids.push(row.id);\n      regionIds.set(row.region, ids);\n    }\n    for (const [region, ids] of [...regionIds.entries()].sort()) {\n      const regionFeatures = ids.map((id) => simplifiedById.get(id)).filter(Boolean);\n      scopeFocus[region] = boundsToFocus(planarPath.bounds(featureCollection(regionFeatures)));\n    }\n  }\n""",
            ),
            (
              """  const sourceProjection = geoNaturalEarth1().fitExtent(\n    [[PADDING, PADDING], [WIDTH - PADDING, HEIGHT - PADDING]],\n    normalized,\n  );\n""",
              """  const sourceProjection = geoNaturalEarth1().fitExtent(\n    [[PADDING, PADDING], [WIDTH - PADDING, HEIGHT - PADDING]],\n    projectionInput,\n  );\n""",
            ),
          ]
          for old, new in patches:
              if old not in source:
                  raise SystemExit('map-generation-core patch anchor not found')
              source = source.replace(old, new, 1)
          core.write_text(source)

          routing = Path('scripts/verify-routing.mjs')
          source = routing.read_text()
          old = """assert.equal(\n  serializeRoutePath(normalizeAvailableRoute(route('/locations/asia'))),\n  '/locations',\n  'An unshipped continent falls back to the domain index rather than a substituted scope.',\n);\n"""
          new = """assert.equal(\n  serializeRoutePath(normalizeAvailableRoute(route('/locations/asia'))),\n  '/locations/asia',\n  'A shipped Asia Locations route survives availability normalisation.',\n);\n"""
          if old not in source:
              raise SystemExit('verify-routing Asia availability anchor not found')
          routing.write_text(source.replace(old, new, 1))

          achievements = Path('scripts/verify-achievements.mjs')
          source = achievements.read_text()
          old = """assert.equal(regionHasCompleteCurriculum('west-africa'), true, 'Africa regions expose the complete four-domain proving-ground curriculum.');\nassert.equal(regionHasCompleteCurriculum('west-asia'), false, 'A Flags-only region is not complete curriculum.');\nconst everywhereQualified = awardEligibleAchievements(empty, () => true);\nassert.equal(isRegionDomainMasteryEarned(everywhereQualified.state, 'west-asia', 'flags'), true, 'A supported individual domain can still earn mastery outside Africa.');\nassert.equal(isRegionComplete(everywhereQualified.state, 'west-asia'), false, 'Unsupported domain absence never counts as complete-region progress.');\n\nconst westAsiaReadModel = getRegionAchievementReadModel(everywhereQualified.state, westAsia.id);\nassert.ok(westAsiaReadModel);\nassert.deepEqual(westAsiaReadModel.supportedDomains, ['flags']);\nassert.equal(westAsiaReadModel.completeCurriculum, false);\nassert.equal(westAsiaReadModel.complete, false);\n"""
          new = """assert.equal(regionHasCompleteCurriculum('west-africa'), true, 'Africa regions expose the complete four-domain proving-ground curriculum.');\nassert.equal(regionHasCompleteCurriculum('west-asia'), false, 'Legacy West Asia is not a learner-facing complete curriculum.');\nconst everywhereQualified = awardEligibleAchievements(empty, () => true);\nassert.equal(isRegionDomainMasteryEarned(everywhereQualified.state, 'west-asia', 'flags'), false, 'Hidden legacy West Asia does not receive new mastery awards.');\nassert.equal(isRegionComplete(everywhereQualified.state, 'west-asia'), false, 'Hidden legacy West Asia never counts as complete-region progress.');\n\nconst legacyWestAsiaState = { ...empty, regionDomainMasteries: ['west-asia:flags'] };\nconst westAsiaReadModel = getRegionAchievementReadModel(legacyWestAsiaState, westAsia.id);\nassert.ok(westAsiaReadModel);\nassert.deepEqual(westAsiaReadModel.supportedDomains, ['flags']);\nassert.equal(westAsiaReadModel.domainMastery.flags, true, 'Previously earned West Asia mastery remains readable from persistence.');\nassert.equal(westAsiaReadModel.completeCurriculum, false);\nassert.equal(westAsiaReadModel.complete, false);\n"""
          if old not in source:
              raise SystemExit('verify-achievements West Asia anchor not found')
          source = source.replace(old, new, 1)

          old = """for (const continentId of ['asia', 'europe', 'north-america', 'south-america', 'oceania']) {\n  assert.equal(continentHasCompleteCurriculum(continentId), false, `${continentId} is not complete curriculum today.`);\n  assert.equal(isContinentComplete(everywhereQualified.state, continentId), false, `${continentId} cannot accidentally complete from Flags-only evidence.`);\n}\n"""
          new = """assert.equal(continentHasCompleteCurriculum('asia'), true, 'Asia is a complete four-domain curriculum after Issue #26.');\nassert.equal(isContinentComplete(everywhereQualified.state, 'asia'), true, 'Universally qualifying evidence can complete the shipped Asia curriculum.');\nfor (const continentId of ['europe', 'north-america', 'south-america', 'oceania']) {\n  assert.equal(continentHasCompleteCurriculum(continentId), false, `${continentId} is not complete curriculum today.`);\n  assert.equal(isContinentComplete(everywhereQualified.state, continentId), false, `${continentId} cannot accidentally complete from Flags-only evidence.`);\n}\n"""
          if old not in source:
              raise SystemExit('verify-achievements continent anchor not found')
          achievements.write_text(source.replace(old, new, 1))
          PY
      - name: Generate canonical geography and run full tests
        id: verification
        shell: bash
        run: |
          set +e
          set -o pipefail
          {
            echo '=== npm run maps:generate ==='
            npm run maps:generate
            generation_status=$?
            echo "generation_status=$generation_status"
            if [ "$generation_status" -eq 0 ]; then
              echo '=== Africa no-drift gate ==='
              git diff --exit-code -- src/data/maps/africa.ts src/data/neighbors/africa.ts docs/architecture/cartography-provenance.json
              africa_status=$?
              echo "africa_status=$africa_status"
            else
              africa_status=1
            fi
            if [ "$generation_status" -eq 0 ] && [ "$africa_status" -eq 0 ]; then
              echo '=== npm test ==='
              npm test
              test_status=$?
            else
              test_status=1
            fi
            echo "test_status=$test_status"
            if [ "$generation_status" -eq 0 ] && [ "$africa_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
              exit 0
            fi
            exit 1
          } 2>&1 | tee /tmp/asia-expansion-verification.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit generation result or diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          status='${{ steps.verification.outputs.status }}'
          git rm .github/workflows/generate-asia-expansion.yml
          if [ "$status" != '0' ]; then
            cp /tmp/asia-expansion-verification.log docs/open/issue-26-generation-failure.txt
            git restore --worktree -- src/data/maps/africa.ts src/data/neighbors/africa.ts docs/architecture/cartography-provenance.json src/data/neighbors/global.ts || true
            rm -f src/data/maps/asia.ts src/data/neighbors/asia.ts docs/architecture/asia-cartography-provenance.json
            git add scripts/map-generation-core.mjs scripts/verify-routing.mjs scripts/verify-achievements.mjs docs/open/issue-26-generation-failure.txt .github/workflows/generate-asia-expansion.yml
            git commit -m "Record Asia generation diagnostic"
            git push origin HEAD:issue-26-asia-middle-east-expansion
            exit 0
          fi
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(scripts/map-generation-core\.mjs|scripts/verify-routing\.mjs|scripts/verify-achievements\.mjs|src/data/maps/asia\.ts|src/data/neighbors/asia\.ts|src/data/neighbors/global\.ts|docs/architecture/asia-cartography-provenance\.json|\.github/workflows/generate-asia-expansion\.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected generated changes:"
            echo "$unexpected"
            exit 1
          fi
          git add scripts/map-generation-core.mjs scripts/verify-routing.mjs scripts/verify-achievements.mjs src/data/maps/asia.ts src/data/neighbors/asia.ts src/data/neighbors/global.ts docs/architecture/asia-cartography-provenance.json .github/workflows/generate-asia-expansion.yml
          git commit -m "Generate and verify canonical Asia geography"
          git push origin HEAD:issue-26-asia-middle-east-expansion
