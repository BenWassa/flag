name: Issue 152 Home metadata acceptance

on:
  push:
    branches: [issue-152-remove-redundant-world-metadata]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-152-remove-redundant-world-metadata
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Exact-production Home and accessibility acceptance
        run: npx playwright test tests/browser/home-coverage-metadata.spec.ts tests/browser/navigation-mastery.spec.ts tests/browser/world-crown.spec.ts --project=chromium --project=mobile-chromium
      - name: Inspect exact artifact
        run: |
          npm run build
          ! grep -F '.atlas-card__identity small' dist/atlas-theme.css
          ! grep -F '<small>World</small>' src/react/screens/PassiveScreens.tsx
          grep -F 'spatial-mode__meta' dist/app.js >/dev/null
          test -f dist/sw.js
      - name: Remove temporary acceptance workflow
        run: |
          rm -f .github/workflows/issue-152-acceptance.yml
          rm -f tests/firebase/firestore-debug.log firestore-debug.log tests/firebase/package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(#152): remove acceptance workflow"
          git push origin HEAD:issue-152-remove-redundant-world-metadata
