name: Issue 92 lockfile sync

on:
  push:
    branches: [issue-92-vite-foundation]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: "!contains(github.event.head_commit.message, 'sync Phase 2 package lock')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-92-vite-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated package lock
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync Phase 2 package lock"
          git push origin HEAD:issue-92-vite-foundation
