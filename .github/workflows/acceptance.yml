name: Exact-production acceptance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  exact-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Download repository-gate production artifact
        uses: actions/download-artifact@v4
        with:
          name: flag-atlas-dist
          path: dist
      - name: Verify exact artifact identity
        run: grep -Fq "name=\"atlas-build\" content=\"${GITHUB_SHA}\"" dist/index.html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Current desktop product contracts
        run: >-
          npx playwright test
          tests/browser/spatial-home-overlay.spec.ts
          tests/browser/spatial-home-matrix.spec.ts
          tests/browser/world-crown.spec.ts
          tests/browser/spatial-scope-selection.spec.ts
          tests/browser/spatial-framing.spec.ts
          tests/browser/spatial-marker-parity.spec.ts
          tests/browser/locations-three-strike.spec.ts
          tests/browser/locations-feedback-geometry.spec.ts
          tests/browser/locations-reduced-motion.spec.ts
          tests/browser/recognition-rounds.spec.ts
          tests/browser/neighbors-suggestions-a11y.spec.ts
          --project=chromium
          --workers=1
          --retries=0
      # #212 tracks two pre-existing mobile marker-parity failures already present
      # on #200's final head. Do not make a known-broken historical assertion a
      # permanent merge gate; restore it here once #212 proves it genuinely green.
      - name: Current mobile product contracts
        run: >-
          npx playwright test
          tests/browser/spatial-home-overlay.spec.ts
          tests/browser/world-crown.spec.ts
          tests/browser/spatial-scope-selection.spec.ts
          tests/browser/spatial-framing.spec.ts
          tests/browser/locations-three-strike.spec.ts
          --project=mobile-chromium
          --workers=1
          --retries=0
      # Temporary #212 evidence. Remove this step before merge once the broad
      # historical contracts have been reconciled and their final command is
      # recorded in the issue closeout.
      - name: Reconciled broad-contract evidence
        run: >-
          npx playwright test
          tests/browser/atlas.spec.ts
          tests/browser/design-token-regression.spec.ts
          tests/browser/navigation-mastery.spec.ts
          tests/browser/spatial-disclosure.spec.ts
          tests/browser/spatial-atlas.spec.ts
          tests/browser/production-matrix.spec.ts
          tests/browser/asia-hardening.spec.ts
          tests/browser/map-neighbors-rounds.spec.ts
          --project=chromium
          --workers=1
          --retries=0
      - name: Exact-production PWA lifecycle
        run: >-
          npx playwright test
          tests/browser/pwa-runtime.spec.ts
          --project=chromium
          --workers=1
          --retries=0
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flag-atlas-browser-diagnostics
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
