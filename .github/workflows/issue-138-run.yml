name: Issue 138 final acceptance

on:
  push:
    branches: [issue-138-world-crown-presentation]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-138-world-crown-presentation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply focused implementation
        run: |
          python3 scripts/issue-138-implement.py
          python3 scripts/issue-138-fix-verifier.py
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Exact production browser acceptance
        run: npx playwright test tests/browser/world-crown.spec.ts tests/browser/pwa-runtime.spec.ts --project=chromium
      - name: Inspect production artifact
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          ! grep -R "World Crown" dist/index.html
          grep -F "World Crown" dist/app.js
      - name: Commit verified candidate
        run: |
          rm -f .github/workflows/issue-138-run.yml
          rm -f scripts/issue-138-implement.py
          rm -f scripts/issue-138-fix-verifier.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "feat(#138): surface earned World Crown"
          git push origin HEAD:issue-138-world-crown-presentation
