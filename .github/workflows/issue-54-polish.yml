name: Apply Issue 54 CSS polish

on:
  push:
    branches:
      - issue-54-remove-rivers
    paths:
      - scripts/issue-54-polish.mjs
      - .github/workflows/issue-54-polish.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'issue-54-remove-rivers' || github.ref == 'refs/heads/issue-54-remove-rivers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-54-remove-rivers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/issue-54-polish.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Commit polish
        run: |
          rm scripts/issue-54-polish.mjs .github/workflows/issue-54-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- styles.css scripts/issue-54-polish.mjs .github/workflows/issue-54-polish.yml
          git diff --cached --check
          git commit -m "Polish river-removal cartography CSS"
          git push origin HEAD:issue-54-remove-rivers
