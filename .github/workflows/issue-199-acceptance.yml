name: Issue 199 acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  spatial-framing:
    if: github.head_ref == 'issue-199-spatial-framing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build exact production artifact
        run: npm run build
      - name: Spatial framing exact-production Chromium matrix
        run: >-
          npx playwright test
          tests/browser/spatial-framing.spec.ts
          tests/browser/spatial-scope-selection.spec.ts
          tests/browser/spatial-home-matrix.spec.ts
          --project=chromium
      - name: Spatial framing mobile-Chromium regression matrix
        run: >-
          npx playwright test
          tests/browser/spatial-framing.spec.ts
          tests/browser/spatial-scope-selection.spec.ts
          --project=mobile-chromium
      - name: PWA runtime regression
        run: npm run test:pwa-runtime
      - name: Upload rendered framing evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-199-rendered-framing
          path: test-results/**/issue-199-*.png
          if-no-files-found: error
