name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      ATLAS_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ATLAS_BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Record exact production identity
        run: echo "Built Atlas ${ATLAS_BUILD_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      ATLAS_BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify identity and record deployed Pages cache behaviour
        env:
          ATLAS_DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${ATLAS_DEPLOY_URL%/}/"
          index_body="$(curl -fsSL "$base")"
          printf '%s' "$index_body" | grep -Fq "name=\"atlas-build\" content=\"${ATLAS_BUILD_SHA}\""
          echo "Pages live build identity: ${ATLAS_BUILD_SHA}"
          app_body="$(curl -fsSL "${base}app.js")"
          hashed="$(printf '%s' "$app_body" | grep -oE 'assets/[A-Za-z0-9_-]+-[A-Za-z0-9_-]+\.js' | head -n 1 || true)"
          test -n "$hashed"
          record() {
            label="$1"
            url="$2"
            observed="$(curl -fsSL -D - -o /dev/null "$url" | tr -d '\r')"
            printf '\n### %s\n%s\n' "$label" "$observed"
            {
              echo "### ${label}"
              echo '```text'
              printf '%s\n' "$observed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          record 'root/navigation' "$base"
          record 'index.html' "${base}index.html"
          record 'sw.js' "${base}sw.js"
          record 'app.js' "${base}app.js"
          record 'stable CSS' "${base}styles.css"
          record 'representative hashed chunk' "${base}${hashed}"
