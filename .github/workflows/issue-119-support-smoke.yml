name: Issue 119 support smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    if: github.head_ref == 'explore/spatial-atlas-moonshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Measure transitional artifact
        run: npm run measure:spatial-artifact > issue-119-artifact-smoke.json
      - name: Exercise Stage 0 harness without final-baseline marker
        run: npm run test:spatial-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-119-support-smoke
          path: |
            issue-119-artifact-smoke.json
            test-results
          if-no-files-found: warn
