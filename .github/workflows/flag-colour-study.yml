name: Flag colour study

on:
  push:
    branches:
      - research/flag-colour-study
    paths:
      - research/flag_colour_study.py
      - .github/workflows/flag-colour-study.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/flag-colour-study
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install cairosvg matplotlib numpy pandas pillow scikit-learn
      - name: Run flag colour study
        run: python research/flag_colour_study.py
      - name: Commit generated research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- research/output/flag-colour-study
          if git diff --cached --quiet; then
            echo "No generated-output changes."
          else
            git commit -m "Generate flag colour study outputs"
            git push origin HEAD:research/flag-colour-study
          fi
