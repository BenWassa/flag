name: Issue 22 cartography bootstrap

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-north-america-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Add North America generator configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/map-continent-configs.mjs')
          s = p.read_text()
          if 'NORTH_AMERICA_MAP_GENERATION_CONFIG' not in s:
              block = r'''export const NORTH_AMERICA_MAP_GENERATION_CONFIG = Object.freeze({
            id: 'north-america',
            displayName: 'North America',
            sourceContinent: 'North America',
            exportPrefix: 'NORTH_AMERICA',
            outputFilename: 'north-america.ts',
            provenanceFilename: 'north-america-cartography-provenance.json',
            expectedCountryCount: 23,
            regionIds: Object.freeze([
              'northern-america',
              'central-america',
              'caribbean',
            ]),
            islandLocatorIds: Object.freeze([]),
            callouts: Object.freeze({}),
            lakes: Object.freeze([]),
            localContextCountryIds: Object.freeze(['COL', 'VEN']),
            localContextBounds: Object.freeze({ minLon: -86, maxLon: -57, minLat: 0, maxLat: 25 }),
            allowedContextPatterns: Object.freeze([]),
            adjacencyMode: 'global',
            policy: 'standard-v1',
            boundaryPolicy: Object.freeze({
              naturalEarthView: 'default de-facto',
              scoredCountries: 'exact Atlas 23-country North America curriculum only',
              southAmericaContext: 'COL and VEN are keyed non-scoring context; PAN-COL adjacency remains global',
              dependenciesAndTerritories: 'non-scoring; explicit source-feature audit required before release',
              maritimeAdjacency: 'none; land adjacency only',
            }),
          });

          '''
              s = s.replace('export const MAP_GENERATION_CONFIGS = Object.freeze([', block + 'export const MAP_GENERATION_CONFIGS = Object.freeze([')
              s = s.replace('  ASIA_MAP_GENERATION_CONFIG,\n]);', '  ASIA_MAP_GENERATION_CONFIG,\n  NORTH_AMERICA_MAP_GENERATION_CONFIG,\n]);')
              p.write_text(s)
          PY
      - name: Generate canonical map assets
        run: npm run maps:generate
      - name: Commit generated North America outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/map-continent-configs.mjs src/data/maps/north-america.ts src/data/neighbors/north-america.ts src/data/neighbors/global.ts docs/architecture/north-america-cartography-provenance.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat(#22): generate canonical North America geography"
          git push origin HEAD:issue-22-north-america-expansion
