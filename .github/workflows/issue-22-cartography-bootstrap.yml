name: Issue 22 cartography measurements

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Measure generated North America geometry
        run: |
          echo "SOURCE_RAW=$(wc -c < src/data/maps/north-america.ts)"
          echo "SOURCE_GZIP=$(gzip -9 -c src/data/maps/north-america.ts | wc -c)"
          npx esbuild src/data/maps/north-america.ts --platform=node --format=esm --outfile=/tmp/north-america.mjs
          node --input-type=module <<'NODE'
          const mod = await import('file:///tmp/north-america.mjs');
          const geometry = mod.NORTH_AMERICA_GEOMETRY;
          const focus = mod.NORTH_AMERICA_SCOPE_FOCUS;
          function bounds(path = '') {
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
            for (const match of path.matchAll(/(-?[\d.]+),(-?[\d.]+)/g)) {
              const x = Number(match[1]), y = Number(match[2]);
              minX = Math.min(minX, x); minY = Math.min(minY, y);
              maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
            }
            return { minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY };
          }
          const ids = ['CAN','USA','MEX','BLZ','SLV','ATG','BHS','BRB','CUB','DMA','DOM','GRD','HTI','JAM','KNA','LCA','VCT','TTO'];
          for (const id of ids) {
            const item = geometry[id];
            console.log(`GEOMETRY ${id} ${JSON.stringify({ ...bounds(item?.path ?? item?.outlinePath ?? ''), locator: item?.locator ?? null, callout: item?.callout ?? null })}`);
          }
          for (const id of ['north-america','northern-america','central-america','caribbean']) {
            console.log(`FOCUS ${id} ${JSON.stringify(focus[id])}`);
          }
          console.log(`GEOMETRY_KEYS=${Object.keys(geometry).sort().join(',')}`);
          console.log(`INSETS=${JSON.stringify(mod.NORTH_AMERICA_INSETS)}`);
          console.log(`WATER=${JSON.stringify((mod.NORTH_AMERICA_WATER.lakes ?? []).map((x) => x.name))}`);
          NODE
