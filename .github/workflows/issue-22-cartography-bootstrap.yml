name: Issue 22 runtime integration

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-north-america-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python3 scripts/issue-22-integrate.py
      - run: npm run check
      - name: Commit runtime integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/map-scopes.ts src/data/maps/index.ts src/data/neighbors/index.ts
          git diff --cached --stat
          git commit -m "feat(#22): register North America learning support" || exit 0
          git push origin HEAD:issue-22-north-america-expansion
