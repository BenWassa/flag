name: Issue 22 full verification

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Measure production North America chunk
        run: |
          chunk=$(find dist/assets -maxdepth 1 -type f -name 'north-america-*.js' | head -1)
          test -n "$chunk"
          echo "NORTH_AMERICA_CHUNK=$chunk"
          echo "CHUNK_RAW=$(wc -c < "$chunk")"
          echo "CHUNK_GZIP=$(gzip -9 -c "$chunk" | wc -c)"
          echo "SOURCE_RAW=$(wc -c < src/data/maps/north-america.ts)"
          echo "SOURCE_GZIP=$(gzip -9 -c src/data/maps/north-america.ts | wc -c)"
