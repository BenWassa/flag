name: Issue 22 North America interaction diagnostics

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Diagnose Hispaniola neighbour map derivation
        run: |
          node scripts/build-verifier-output.mjs
          node --input-type=module <<'NODE'
          const maps = await import('./.verify-dist/data/maps/index.js');
          const neighborMap = await import('./.verify-dist/domain/neighbor-map.js');
          for (const targetId of ['HTI','DOM','PAN']) {
            const asset = await maps.loadMapAsset(targetId === 'PAN' ? 'central-america' : 'caribbean');
            const ids = targetId === 'HTI' ? ['DOM'] : targetId === 'DOM' ? ['HTI'] : ['COL','CRI'];
            try {
              const model = neighborMap.deriveNeighborMapModel(asset, { targetId, neighborIds: ids, foundIds: [], revealedIds: [] }, (id) => id);
              console.log('NEIGHBOR_MODEL_OK', targetId, JSON.stringify({focus:model.focus,puzzle:model.puzzleCountries.map(x=>x.countryId)}));
            } catch (error) {
              console.error('NEIGHBOR_MODEL_ERROR', targetId, error?.stack ?? error);
              process.exitCode = 1;
            }
          }
          NODE
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Create pointer diagnostic
        run: |
          cat > tests/browser/issue-22-pointer-diagnostic.spec.ts <<'EOF'
          import { test, expect } from '@playwright/test';
          test('diagnoses invisible hit pointer delivery', async ({ page }) => {
            test.setTimeout(90000);
            await page.setViewportSize({width:390,height:844});
            await page.addInitScript(() => {
              Object.defineProperty(globalThis.crypto, 'randomUUID', { configurable:true, value:()=> 'issue-22-pointer-diagnostic' });
              (window as any).__clicks = [];
              document.addEventListener('click', (event) => {
                const target = event.target instanceof Element ? event.target : null;
                (window as any).__clicks.push({
                  tag: target?.tagName ?? null,
                  cls: target?.getAttribute('class') ?? null,
                  id: target?.closest('[data-action="map-answer"]')?.getAttribute('data-id') ?? null,
                });
              }, true);
            });
            await page.goto('/#/locations/north-america');
            await page.getByRole('button', {name:'Play Caribbean'}).click();
            await expect(page.locator('#map-prompt-heading')).toBeVisible({timeout:40000});
            await expect(page.locator('[data-map-viewport]')).toHaveAttribute('data-map-positioned','true');
            for (let step=0; step<13; step++) {
              const heading = await page.locator('#map-prompt-heading').innerText();
              const hit = page.locator('.map-current-target-hit');
              const hitCount = await hit.count();
              console.log('TARGET', step, heading, 'HIT', hitCount, hitCount ? await hit.getAttribute('data-id') : 'none');
              if (hitCount) {
                const before = await page.locator('.map-round-count').innerText();
                const box = await hit.boundingBox();
                console.log('HIT_BOX', JSON.stringify(box));
                const owner = box ? await page.evaluate(({x,y}) => document.elementFromPoint(x,y)?.closest('[data-action="map-answer"]')?.getAttribute('data-id') ?? null, {x:box.x+box.width/2,y:box.y+box.height/2}) : null;
                console.log('OWNER_BEFORE', owner);
                if (box) await page.mouse.click(box.x+box.width/2, box.y+box.height/2);
                await page.waitForTimeout(900);
                console.log('AFTER_MOUSE', await page.locator('#map-prompt-heading').innerText(), await page.locator('.map-round-count').innerText(), JSON.stringify(await page.evaluate(() => (window as any).__clicks)));
                if ((await page.locator('.map-round-count').innerText()) === before) {
                  await hit.dispatchEvent('click');
                  await page.waitForTimeout(900);
                  console.log('AFTER_DISPATCH', await page.locator('#map-prompt-heading').innerText(), await page.locator('.map-round-count').innerText(), JSON.stringify(await page.evaluate(() => (window as any).__clicks)));
                }
                return;
              }
              const group = page.locator('.map-active-countries > .map-country[data-action="map-answer"]').filter({has: page.locator('.map-country__shape')}).first();
              await group.focus();
              await group.press('Enter');
              await page.waitForTimeout(1700);
            }
            throw new Error('No hit-assist target encountered');
          });
          EOF
      - run: npx playwright test tests/browser/issue-22-pointer-diagnostic.spec.ts --project=chromium
