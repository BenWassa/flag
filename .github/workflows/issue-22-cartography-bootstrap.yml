name: Issue 22 cartography audit

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Natural Earth North America source features
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('scripts/map-sources/natural-earth.json', 'utf8'));
          const source = manifest.sources.countries;
          const url = `${manifest.rawBaseUrl}/${manifest.upstreamCommit}/${source.path}`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`source fetch failed: ${response.status}`);
          const collection = await response.json();
          const rows = collection.features
            .filter((feature) => String(feature.properties?.CONTINENT ?? '') === 'North America')
            .map((feature) => {
              const p = feature.properties ?? {};
              return {
                name: p.ADMIN ?? p.NAME ?? p.NAME_EN ?? p.GEOUNIT ?? p.SUBUNIT,
                geounit: p.GEOUNIT,
                subunit: p.SUBUNIT,
                type: p.TYPE,
                sovereign: p.SOVEREIGNT,
                ISO_A3_EH: p.ISO_A3_EH,
                ADM0_A3: p.ADM0_A3,
                ISO_A3: p.ISO_A3,
                SOV_A3: p.SOV_A3,
                SU_A3: p.SU_A3,
                GU_A3: p.GU_A3,
              };
            })
            .sort((a, b) => String(a.name).localeCompare(String(b.name)));
          console.log(`NORTH_AMERICA_SOURCE_FEATURES=${rows.length}`);
          for (const row of rows) console.log(JSON.stringify(row));
          NODE
