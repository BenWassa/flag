name: Issue 22 North America focused verification

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/build-verifier-output.mjs
      - run: node scripts/verify-north-america.mjs
      - name: Measure verifier payload
        run: |
          echo "VERIFY_RAW=$(wc -c < .verify-dist/data/maps/north-america.js)"
          echo "VERIFY_GZIP=$(gzip -9 -c .verify-dist/data/maps/north-america.js | wc -c)"
