name: Issue 22 North America browser QA

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run focused production browser matrix
        run: npx playwright test tests/browser/north-america.spec.ts tests/browser/production-matrix.spec.ts tests/browser/map-hit-precedence.spec.ts tests/browser/map-insets.spec.ts --project=chromium
