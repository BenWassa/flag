name: Issue 22 cartography refinement

on:
  push:
    branches: [issue-22-north-america-expansion]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-north-america-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generalise viewport-only component filtering and hit assistance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/map-generation-core.mjs')
          s = p.read_text()

          old = """  const contextPatterns = (config.allowedContextPatterns ?? []).map(\n    (spec) => new RegExp(spec.pattern, spec.flags ?? 'i'),\n  );\n  const unexpected = [];\n  for (const sourceFeature of countriesSource.features) {\n    if (String(sourceFeature.properties?.CONTINENT ?? '').toLowerCase() !== config.sourceContinent.toLowerCase()) continue;\n    const id = sourceCountryId(sourceFeature, allIds);\n    if (id && (scoredIds.has(id) || localContextIds.has(id))) continue;\n    const name = sourceName(sourceFeature) || '(unnamed)';\n    if (contextPatterns.length && !contextPatterns.some((pattern) => pattern.test(name))) {\n      unexpected.push(name);\n      continue;\n    }\n    normalized.push({\n"""
          new = """  const contextPatterns = (config.allowedContextPatterns ?? []).map(\n    (spec) => new RegExp(spec.pattern, spec.flags ?? 'i'),\n  );\n  const excludedContextPatterns = (config.excludedContextPatterns ?? []).map(\n    (spec) => new RegExp(spec.pattern, spec.flags ?? 'i'),\n  );\n  const unexpected = [];\n  for (const sourceFeature of countriesSource.features) {\n    if (String(sourceFeature.properties?.CONTINENT ?? '').toLowerCase() !== config.sourceContinent.toLowerCase()) continue;\n    const id = sourceCountryId(sourceFeature, allIds);\n    if (id && (scoredIds.has(id) || localContextIds.has(id))) continue;\n    const name = sourceName(sourceFeature) || '(unnamed)';\n    if (excludedContextPatterns.some((pattern) => pattern.test(name))) continue;\n    if (contextPatterns.length && !contextPatterns.some((pattern) => pattern.test(name))) {\n      unexpected.push(name);\n      continue;\n    }\n    normalized.push({\n"""
          if old not in s: raise SystemExit('context policy anchor not found')
          s = s.replace(old, new)

          old = """function boundsToFocus(bounds, padding = 26) {\n  const [[x0, y0], [x1, y1]] = bounds;\n  let width = Math.max(1, x1 - x0) + padding * 2;\n  let height = Math.max(1, y1 - y0) + padding * 2;\n  width = Math.max(width, 180);\n  height = Math.max(height, 170);\n"""
          new = """function boundsToFocus(bounds, padding = 26, minimum = {}) {\n  const [[x0, y0], [x1, y1]] = bounds;\n  let width = Math.max(1, x1 - x0) + padding * 2;\n  let height = Math.max(1, y1 - y0) + padding * 2;\n  width = Math.max(width, minimum.width ?? 180);\n  height = Math.max(height, minimum.height ?? 170);\n"""
          if old not in s: raise SystemExit('boundsToFocus anchor not found')
          s = s.replace(old, new)

          old = """  const fitExcludedIds = new Set(config.fitExcludeCountryIds ?? []);\n  const fitCollection = featureCollection(normalized.features.filter((item) => {\n    const countryId = item.properties?.countryId;\n    return !countryId || !fitExcludedIds.has(countryId);\n  }));\n  if (!fitCollection.features.length) throw new Error(`${config.displayName} viewport-fit policy removed every feature.`);\n"""
          new = """  const fitExcludedIds = new Set(config.fitExcludeCountryIds ?? []);\n  const fitCountryBounds = config.fitCountryBounds ?? {};\n  const fitExcludedContextPatterns = (config.fitExcludeContextPatterns ?? []).map(\n    (spec) => new RegExp(spec.pattern, spec.flags ?? 'i'),\n  );\n  const fitCollection = featureCollection(normalized.features.flatMap((item) => {\n    const countryId = item.properties?.countryId;\n    if (countryId && fitExcludedIds.has(countryId)) return [];\n    if (item.properties?.role === 'context'\n      && fitExcludedContextPatterns.some((pattern) => pattern.test(sourceName(item)))) return [];\n    const bounds = countryId ? fitCountryBounds[countryId] : undefined;\n    if (!bounds) return [item];\n    const geometry = filterGeometryByBounds(item.geometry, bounds);\n    if (!geometry) {\n      throw new Error(`${config.displayName} viewport-fit bounds removed every component of ${countryId}.`);\n    }\n    return [{ ...item, geometry }];\n  }));\n  if (!fitCollection.features.length) throw new Error(`${config.displayName} viewport-fit policy removed every feature.`);\n"""
          if old not in s: raise SystemExit('fitCollection anchor not found')
          s = s.replace(old, new)

          old = """  const islandLocators = new Set(config.islandLocatorIds ?? []);\n"""
          new = """  const islandLocators = new Set(config.islandLocatorIds ?? []);\n  const hitAssistIds = new Set(config.hitAssistIds ?? []);\n  for (const id of hitAssistIds) {\n    if (islandLocators.has(id)) {\n      throw new Error(`${config.displayName} ${id} cannot use both a visible locator and invisible hit assistance.`);\n    }\n  }\n"""
          if old not in s: raise SystemExit('islandLocators anchor not found')
          s = s.replace(old, new)

          old = """    if (item.properties?.role === 'country' && islandLocators.has(id)) {\n      const centroid = planarPath.centroid(item);\n      countryGeometry.outlinePath = countryPath;\n      countryGeometry.locator = {\n        cx: Number(centroid[0].toFixed(2)),\n        cy: Number(centroid[1].toFixed(2)),\n        r: 7,\n      };\n    } else {\n      countryGeometry.path = answerableIds.has(id)\n        ? countryPath\n        : (clippedPath(item) || countryPath);\n    }\n    if (item.properties?.role === 'country') {\n"""
          new = """    if (item.properties?.role === 'country' && islandLocators.has(id)) {\n      const centroid = planarPath.centroid(item);\n      const anchor = config.locatorAnchorMode === 'pole'\n        ? poleOfInaccessibility(pathRings(countryPath))\n        : { x: centroid[0], y: centroid[1] };\n      countryGeometry.outlinePath = countryPath;\n      countryGeometry.locator = {\n        cx: Number(anchor.x.toFixed(2)),\n        cy: Number(anchor.y.toFixed(2)),\n        r: 7,\n      };\n    } else {\n      countryGeometry.path = answerableIds.has(id)\n        ? countryPath\n        : (clippedPath(item) || countryPath);\n    }\n    if (item.properties?.role === 'country' && hitAssistIds.has(id)) {\n      const anchor = poleOfInaccessibility(pathRings(countryPath));\n      countryGeometry.hitAssist = {\n        cx: Number(anchor.x.toFixed(2)),\n        cy: Number(anchor.y.toFixed(2)),\n        r: 7,\n      };\n    }\n    if (item.properties?.role === 'country') {\n"""
          if old not in s: raise SystemExit('geometry assistance anchor not found')
          s = s.replace(old, new)

          old = """  const focusExcludedIds = new Set(config.focusExcludeCountryIds ?? []);\n  const focusForIds = (ids) => {\n    const preferredIds = ids.filter((id) => !focusExcludedIds.has(id));\n    const focusIds = preferredIds.length ? preferredIds : ids;\n    const regionFeatures = focusIds.map((id) => simplifiedById.get(id)).filter(Boolean);\n    const bounds = planarPath.bounds(featureCollection(regionFeatures));\n"""
          new = """  const focusExcludedIds = new Set(config.focusExcludeCountryIds ?? []);\n  const focusCountryBounds = config.focusCountryBounds ?? {};\n  const focusProjectedById = new Map(\n    normalized.features\n      .filter((item) => item.properties?.countryId && focusCountryBounds[item.properties.countryId])\n      .map((item) => {\n        const id = item.properties.countryId;\n        const filtered = filterGeometryByBounds(item.geometry, focusCountryBounds[id]);\n        if (!filtered) throw new Error(`${config.displayName} focus bounds removed every component of ${id}.`);\n        return [id, {\n          type: 'Feature',\n          properties: { ...item.properties },\n          geometry: projectGeometry(filtered, projection),\n        }];\n      }),\n  );\n  const focusForIds = (ids, scopeId) => {\n    const preferredIds = ids.filter((id) => !focusExcludedIds.has(id));\n    const focusIds = preferredIds.length ? preferredIds : ids;\n    const regionFeatures = focusIds\n      .map((id) => focusProjectedById.get(id) ?? simplifiedById.get(id))\n      .filter(Boolean);\n    const bounds = planarPath.bounds(featureCollection(regionFeatures));\n"""
          if old not in s: raise SystemExit('focus anchor not found')
          s = s.replace(old, new)

          old = """      for (const circle of [geometry[id]?.locator, geometry[id]?.callout?.target]) {\n"""
          new = """      for (const circle of [geometry[id]?.locator, geometry[id]?.hitAssist, geometry[id]?.callout?.target]) {\n"""
          if old not in s: raise SystemExit('focus assistance anchor not found')
          s = s.replace(old, new)

          old = """    return boundsToFocus(bounds);\n  };\n"""
          new = """    return boundsToFocus(bounds, 26, config.focusMinimumByScope?.[scopeId]);\n  };\n"""
          if old not in s: raise SystemExit('focus return anchor not found')
          s = s.replace(old, new, 1)

          s = s.replace("[config.id]: focusForIds(scoredCatalog.map((row) => row.id)),", "[config.id]: focusForIds(scoredCatalog.map((row) => row.id), config.id),")
          s = s.replace("scopeFocus[region] = focusForIds(ids);", "scopeFocus[region] = focusForIds(ids, region);")
          s = s.replace("scopeFocus[scopeId] = focusForIds(ids);", "scopeFocus[scopeId] = focusForIds(ids, scopeId);")

          old = """  for (const circle of [geometry.locator, geometry.callout?.target]) {\n"""
          new = """  for (const circle of [geometry.locator, geometry.hitAssist, geometry.callout?.target]) {\n"""
          if old not in s: raise SystemExit('geometryBounds assist anchor not found')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - name: Refine North America generation policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/map-continent-configs.mjs')
          s = p.read_text()
          start = s.index('export const NORTH_AMERICA_MAP_GENERATION_CONFIG')
          end = s.index('\nexport const MAP_GENERATION_CONFIGS', start)
          block = r'''export const NORTH_AMERICA_MAP_GENERATION_CONFIG = Object.freeze({
            id: 'north-america',
            displayName: 'North America',
            sourceContinent: 'North America',
            exportPrefix: 'NORTH_AMERICA',
            outputFilename: 'north-america.ts',
            provenanceFilename: 'north-america-cartography-provenance.json',
            expectedCountryCount: 23,
            regionIds: Object.freeze([
              'northern-america',
              'central-america',
              'caribbean',
            ]),
            // The Lesser Antilles are too dense for seven overlapping locator dots.
            // Keep their real polygons on the map and magnify only the three
            // demonstrated clusters when one of their members is the question.
            islandLocatorIds: Object.freeze([]),
            hitAssistIds: Object.freeze(['BHS', 'BLZ', 'DOM', 'HTI', 'JAM', 'SLV', 'TTO']),
            callouts: Object.freeze({}),
            insets: Object.freeze([
              Object.freeze({
                id: 'northern-lesser-antilles',
                label: 'Northern Lesser Antilles',
                countryIds: Object.freeze(['KNA', 'ATG']),
                anchor: 'top-right',
              }),
              Object.freeze({
                id: 'windward-islands-north',
                label: 'Windward Islands',
                countryIds: Object.freeze(['DMA', 'LCA']),
                anchor: 'top-right',
              }),
              Object.freeze({
                id: 'windward-islands-south',
                label: 'Southern Windward Islands',
                countryIds: Object.freeze(['VCT', 'GRD', 'BRB']),
                anchor: 'top-right',
              }),
            ]),
            lakes: Object.freeze([
              Object.freeze({ name: 'Lake Superior', pattern: 'superior', flags: 'i', required: true }),
              Object.freeze({ name: 'Lake Michigan', pattern: 'michigan', flags: 'i', required: true }),
              Object.freeze({ name: 'Lake Huron', pattern: 'huron', flags: 'i', required: true }),
              Object.freeze({ name: 'Lake Erie', pattern: '\\berie\\b', flags: 'i', required: true }),
              Object.freeze({ name: 'Lake Ontario', pattern: 'ontario', flags: 'i', required: true }),
            ]),
            // COL preserves PAN-COL edge context. FRA/NLD are clipped to the
            // Caribbean so their canonical overseas geometry can appear as
            // non-scoring context without importing metropolitan Europe.
            localContextCountryIds: Object.freeze(['COL', 'VEN', 'FRA', 'NLD']),
            localContextBounds: Object.freeze({ minLon: -90, maxLon: -55, minLat: 0, maxLat: 30 }),
            allowedContextPatterns: Object.freeze([
              Object.freeze({ pattern: '(anguilla|aruba|bajo nuevo|bermuda|british virgin|cayman|cura|greenland|montserrat|puerto rico|saint barthelemy|saint martin|saint pierre|serranilla|sint maarten|turks and caicos|united states virgin|guantanamo)', flags: 'i' }),
            ]),
            excludedContextPatterns: Object.freeze([
              Object.freeze({ pattern: 'united states minor outlying islands', flags: 'i' }),
            ]),
            // Greenland and Bermuda remain truthful context, but neither should
            // determine the projection scale used to teach the 23-country scope.
            fitExcludeContextPatterns: Object.freeze([
              Object.freeze({ pattern: 'greenland', flags: 'i' }),
              Object.freeze({ pattern: 'bermuda', flags: 'i' }),
            ]),
            // Preserve whole-country USA geometry for rendering and Outlines.
            // Only viewport calculations ignore Hawaii and the remote Aleutian
            // components that otherwise span almost the full 835-unit canvas.
            fitCountryBounds: Object.freeze({
              USA: Object.freeze({ minLon: -170, maxLon: -50, minLat: 24, maxLat: 75 }),
            }),
            focusCountryBounds: Object.freeze({
              USA: Object.freeze({ minLon: -170, maxLon: -50, minLat: 24, maxLat: 75 }),
            }),
            // Region-level first views solve most precision problems more quietly
            // than permanent assistance marks. These minima affect framing only.
            focusMinimumByScope: Object.freeze({
              'central-america': Object.freeze({ width: 120, height: 110 }),
              caribbean: Object.freeze({ width: 105, height: 105 }),
            }),
            physicalTolerance: Object.freeze({ ocean: 1.4, coastline: 1.15, lakes: 0.6 }),
            adjacencyMode: 'global',
            policy: 'standard-v1',
            boundaryPolicy: Object.freeze({
              naturalEarthView: 'default de-facto',
              scoredCountries: 'exact Atlas 23-country North America curriculum only',
              canadaUnitedStates: 'canonical whole-country CAN/USA; USA remote multipart components are excluded from viewport fit/focus only, never from scored geometry or Outlines',
              southAmericaContext: 'COL and VEN are keyed non-scoring context; PAN-COL adjacency remains global',
              franceNetherlandsContext: 'FRA and NLD are keyed non-scoring context clipped to Caribbean overseas geometry; metropolitan Europe is not loaded into this viewport',
              greenland: 'non-scoring Danish context; rendered when visible but excluded from projection fit',
              bermuda: 'non-scoring British dependency context; rendered when visible but excluded from projection fit',
              saintPierreAndMiquelon: 'non-scoring French dependency context near Canada',
              puertoRico: 'non-scoring United States dependency context in the Caribbean',
              britishCaribbean: 'Anguilla, British Virgin Islands, Cayman Islands, Montserrat and Turks and Caicos Islands are non-scoring context',
              frenchCaribbean: 'Saint Barthelemy and Saint Martin are non-scoring source context; FRA Caribbean geometry is keyed non-scoring context',
              dutchCaribbean: 'Aruba, Curacao and Sint Maarten are non-scoring source context; NLD Caribbean geometry is keyed non-scoring context',
              disputedBanks: 'Bajo Nuevo Bank and Serranilla Bank remain non-scoring Natural Earth indeterminate context',
              guantanamo: 'Natural Earth Guantanamo Bay lease remains non-scoring context and is not promoted to an Atlas country',
              usMinorOutlyingIslands: 'explicitly excluded from North America runtime context because remote Pacific dependencies are irrelevant to this learner viewport',
              maritimeAdjacency: 'none; topology-derived land adjacency only, including explicit empty sets',
              assistance: 'real polygons first; invisible hit assistance for BHS/BLZ/DOM/HTI/JAM/SLV/TTO; true-scale insets for KNA+ATG, DMA+LCA and VCT+GRD+BRB; no leader-line callouts or schematic relocation',
            }),
          });
'''
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Regenerate canonical map assets
        run: npm run maps:generate
      - name: Commit refined generator and generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/map-generation-core.mjs scripts/map-continent-configs.mjs src/data/maps src/data/neighbors docs/architecture/*cartography-provenance.json
          git diff --cached --stat
          git commit -m "feat(#22): harden North America cartography" || exit 0
          git push origin HEAD:issue-22-north-america-expansion
