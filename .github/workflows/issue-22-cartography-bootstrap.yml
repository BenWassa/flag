name: Issue 22 production QA

on:
  push:
    branches:
      - issue-22-north-america-expansion

permissions:
  contents: read

jobs:
  focused-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: North America production browser gate
        run: >-
          npx playwright test
          tests/browser/north-america.spec.ts
          tests/browser/map-pointer-capture.spec.ts
          tests/browser/production-matrix.spec.ts
          tests/browser/map-hit-precedence.spec.ts
          tests/browser/map-insets.spec.ts
          tests/browser/atlas.spec.ts
          --project=chromium
