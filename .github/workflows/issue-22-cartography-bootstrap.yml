name: Issue 22 production QA

on:
  push:
    branches:
      - issue-22-north-america-expansion

permissions:
  contents: write

jobs:
  focused-browser:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-22-north-america-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fix neighbour host lifecycle and Play feedback harness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/react/screens/NeighborScreens.tsx')
          s = p.read_text()
          old = '<div className="neighbor-map-host" data-neighbor-map-host data-neighbor-map-key={mapKey}'
          new = '<div key={mapKey} className="neighbor-map-host" data-neighbor-map-host data-neighbor-map-key={mapKey}'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Neighbour host anchor not found')
          p.write_text(s)

          p = Path('tests/browser/north-america.spec.ts')
          s = p.read_text()
          old = "      await expect(page.locator('.answer-feedback--wrong')).toBeVisible();\n      await answerCurrentLocationCorrectly(page, targetId);\n      sawWrong = true;"
          new = "      await expect(page.locator('.answer-feedback--wrong')).toBeVisible();\n      // Play resolves the target on the first scored tap; a wrong answer is not retryable.\n      // The normal dwell/advance is asserted by the prompt transition below.\n      sawWrong = true;"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'Play resolves the target on the first scored tap' not in s:
              raise SystemExit('Central America feedback anchor not found')
          p.write_text(s)
          PY
      - name: Commit runtime and QA corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/react/screens/NeighborScreens.tsx tests/browser/north-america.spec.ts
          git commit -m "fix(#22): reset neighbour map host between targets"
          git push origin HEAD:issue-22-north-america-expansion
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: North America production browser gate
        run: >-
          npx playwright test
          tests/browser/north-america.spec.ts
          tests/browser/map-pointer-capture.spec.ts
          tests/browser/production-matrix.spec.ts
          tests/browser/map-hit-precedence.spec.ts
          tests/browser/map-insets.spec.ts
          tests/browser/atlas.spec.ts
          --project=chromium
