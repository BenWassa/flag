name: One-time post-Spatial housekeeping

on:
  push:
    branches:
      - docs/post-spatial-project-truth

permissions:
  contents: write

jobs:
  reconcile-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-spatial-project-truth
          fetch-depth: 0

      - name: Reconcile moved documentation links
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          roots = [Path('.'),]
          extensions = {'.md', '.ts', '.tsx', '.js', '.mjs', '.json', '.yml', '.yaml'}
          replacements = {
              '../open/issue-119-': '../closed/issue-119-',
              'docs/open/issue-119-': 'docs/closed/issue-119-',
              '../open/issue-104-map-first-launcher.md': '../closed/issue-104-map-first-launcher.md',
              'docs/open/issue-104-map-first-launcher.md': 'docs/closed/issue-104-map-first-launcher.md',
              '../open/issue-118-design-skill-audit.md': '../closed/issue-118-design-skill-audit.md',
              'docs/open/issue-118-design-skill-audit.md': 'docs/closed/issue-118-design-skill-audit.md',
              '../open/issue-166-spatial-production-cutover.md': '../closed/issue-166-spatial-production-cutover.md',
              'docs/open/issue-166-spatial-production-cutover.md': 'docs/closed/issue-166-spatial-production-cutover.md',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in extensions or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text()
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)

          cartography = Path('docs/architecture/cartography.md')
          text = cartography.read_text()
          pattern = re.compile(
              r'## Spherical geography \(Issue #119, exploration line\)\n.*?(?=## Production decision)',
              re.S,
          )
          replacement = '''## Spherical geography (production Spatial Atlas)\n\nSpatial Atlas is a **production second output** of the same pinned cartography\npipeline, not a second geography system. `scripts/generate-globe-assets.mjs`\nreads the same pinned Natural Earth source through the same digest checks,\nresolves canonical ISO3 identity under the same policy and emits geographic\nlat/lon geometry into `src/data/globe/`. The projected learning maps and\nspherical world/continent LODs therefore share source identity and geopolitical\npolicy.\n\n```text\npinned source geodata\n  ├── projected 2D continent assets     (npm run maps:generate)\n  └── spherical world + continent LODs (npm run globe:generate)\n```\n\nThe accepted spherical contract is preserved in\n[`../closed/issue-119-spherical-geography-contract.md`](../closed/issue-119-spherical-geography-contract.md)\nand asserted by the Spatial verifier chain. #119 established this architecture;\n#166 promoted it into the default production presentation.\n\n'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate the stale cartography Spatial section')
          cartography.write_text(updated)

          workflow = Path('.github/workflows/post-spatial-housekeeping-temporary.yml')
          workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs: repair archived links and cartography truth"
            git push origin HEAD:docs/post-spatial-project-truth
          fi

      - name: Delete audited stale remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          stale = [
              'claude/full-spatial-atlas-8qthhl',
              'claude/moon-shot-issue-118-icybds',
              'claude/open-issues-review-plan-tz6n9e',
              'claude/spatial-atlas-production-cutover-0y9w8r',
              'docs/v1-project-truth-integration',
              'docs/22-north-america-closeout',
              'docs/46-firebase-closeout',
              'docs/118-followup-links',
              'explore/spatial-atlas-moonshot',
              'firebase/106-cloud-progress',
              'firebase/106-cloud-progress-merge-base',
              'firebase/106-cloud-progress-sync-backup',
              'firebase/107-acceptance-diagnostics',
              'firebase/107-fix-degraded-selector',
              'firebase/107-fix-deploy-concurrency',
              'firebase/107-fix-live-acceptance',
              'firebase/107-hosting-acceptance',
              'firebase/107-hosting-closeout-record',
              'fix/119-firebase-live-selector',
              'issue-22-north-america-expansion',
              'issue-27-oceania-expansion',
              'issue-111-launcher-polish',
              'issue-112-africa-framing-togo-callout',
              'issue-113-mobile-inset-pattern',
              'issue-119-deployed-spatial-preview',
              'issue-123-maplibre-evidence',
              'issue-124-renderer-reconciliation',
              'issue-138-world-crown-presentation',
              'moonshot/full-spatial-atlas',
              'noop',
              'noop-2',
              'preview/spatial-atlas-deployed',
              'project-closeout-housekeeping',
              'spike/119-maplibre-atlas-runtime',
              'spike/119-r3f-atlas-runtime',
              'verify/issue-27-post22-acceptance',
          ]
          protected = {
              'main',
              'archive/atlas-alpha-pre-spatial-cutover-2026-08-29',
              'issue-137-asia-location-hardening',
              'issue-146-launcher-mastery-semantics',
              'issue-147-outlines-feedback-parity',
              'docs/post-spatial-project-truth',
          }
          assert not protected.intersection(stale)

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'atlas-housekeeping',
          }

          for branch in stale:
              encoded = urllib.parse.quote(branch, safe='/')
              url = f'https://api.github.com/repos/{repo}/git/refs/heads/{encoded}'
              request = urllib.request.Request(url, method='DELETE', headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      if response.status != 204:
                          raise RuntimeError(f'{branch}: unexpected HTTP {response.status}')
                  print(f'deleted {branch}')
              except urllib.error.HTTPError as error:
                  if error.code == 422 or error.code == 404:
                      print(f'already absent {branch}')
                  else:
                      print(error.read().decode('utf-8', errors='replace'))
                      raise

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/branches?per_page=100',
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              remaining = [item['name'] for item in json.load(response)]
          print('remaining branches:')
          for branch in remaining:
              print(f'  {branch}')

          unexpected = set(remaining) - protected
          missing = protected - set(remaining)
          if unexpected:
              raise SystemExit(f'unexpected branches remain: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'protected branches missing: {sorted(missing)}')
          PY
