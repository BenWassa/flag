name: Issue 191 Verifier Fix

on:
  push:
    branches: [issue-191-automatic-pwa-updates]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-191-automatic-pwa-updates
      - name: Replace retired release-cache assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path('scripts').glob('verify-*.mjs'):
              source = path.read_text()
              if 'flag-atlas-v29' not in source and 'flag-atlas-v30' not in source:
                  continue
              updated = source.replace('flag-atlas-v29', 'flag-atlas-runtime-v1').replace('flag-atlas-v30', 'flag-atlas-runtime-v1')
              updated = updated.replace('v29 PWA cache', 'stable PWA runtime-cache schema')
              updated = updated.replace('v29', 'stable')
              updated = updated.replace('v30', 'stable')
              path.write_text(updated)
              changed.append(str(path))
          if not changed:
              raise SystemExit('no stale verifier assertions found')
          print('\n'.join(changed))
          PY
          git rm .github/workflows/issue-191-verifier-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts
          git commit -m "test: align verifiers with stable PWA cache schema"
          git push origin HEAD:issue-191-automatic-pwa-updates
