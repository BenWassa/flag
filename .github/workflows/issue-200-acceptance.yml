name: Issue 200 acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    if: github.head_ref == 'issue-200-spatial-marker-hit-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Tiny-marker exact-production Chromium interaction
        run: >-
          npx playwright test
          tests/browser/spatial-marker-parity.spec.ts
          tests/browser/spatial-atlas.spec.ts
          --project=chromium
      - name: Tiny-marker exact-production mobile Chromium interaction
        run: >-
          npx playwright test
          tests/browser/spatial-marker-parity.spec.ts
          --project=mobile-chromium
