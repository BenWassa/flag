name: Issue 231 desktop inset diagnostic

on:
  push:
    branches:
      - fix-inset-touch-pointer-events

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-inset-touch-pointer-events
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/inset-desktop-debug.spec.ts --project=chromium --workers=1 --retries=0 --reporter=line
