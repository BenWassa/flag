name: Apply Issue 196 refinement

on:
  push:
    branches:
      - issue-196-home-chooser-chrome

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python scripts/apply-issue-196.py
      - name: Remove temporary helpers
        run: rm scripts/apply-issue-196.py .github/workflows/issue-196-apply.yml
      - name: Commit focused implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/styles/spatial.css DESIGN.md .impeccable/design.json tests/browser/spatial-home-overlay.spec.ts scripts/apply-issue-196.py .github/workflows/issue-196-apply.yml
          git commit -m "fix(#196): align Home chooser with Atlas chrome"
          git push origin HEAD:issue-196-home-chooser-chrome
