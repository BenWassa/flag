name: Issue 201 sync

on:
  push:
    branches:
      - issue-201-locations-feedback-geometry

permissions:
  contents: write

jobs:
  sync-current-main:
    if: github.event.head_commit.message != 'Sync 201 with current main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-201-locations-feedback-geometry
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          git config user.name "Flag Atlas integration"
          git config user.email "noreply@example.invalid"
          git fetch origin main
          if ! git merge --no-ff origin/main -m "Sync 201 with current main"; then
            echo "Conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git push origin HEAD:issue-201-locations-feedback-geometry
