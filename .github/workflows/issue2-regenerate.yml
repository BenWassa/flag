name: Issue 2 regenerate canonical cartography

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'issue-2-country-outlines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run maps:generate
      - name: Commit regenerated canonical asset when changed
        shell: bash
        run: |
          if git diff --quiet -- src/data/maps/africa.ts docs/CARTOGRAPHY_PROVENANCE.json; then
            echo "Canonical cartography already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/maps/africa.ts docs/CARTOGRAPHY_PROVENANCE.json
          git commit -m "chore(cartography): regenerate Africa geometry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
