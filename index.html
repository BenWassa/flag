<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="A focused, adaptive way to learn world geography through flags, locations, outlines, and land-border neighbours." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!--
      iOS Safari does not honour the manifest's "display": "standalone" — it
      only launches chrome-free from the home screen when these proprietary
      tags are present. mobile-web-app-capable is the non-WebKit successor,
      kept alongside apple-mobile-web-app-capable rather than replacing it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="stylesheet" href="./src/styles/styles.css" />
    <link rel="stylesheet" href="./src/styles/map.css" />
    <link rel="stylesheet" href="./src/styles/map-cartography.css" />
    <link rel="stylesheet" href="./src/styles/outline.css" />
    <link rel="stylesheet" href="./src/styles/neighbors.css" />
    <link rel="stylesheet" href="./src/styles/atlas-theme.css" />
    <title>Atlas</title>
  </head>
  <body>
    <!--
      THESIS: Geography is the content; the interface is a tactile instrument around it.
      OWN-WORLD: Cool near-white canvas, graphite type, Atlas Blue actions, restrained squircles and shallow physical depth.
      STORY: Choose a geographic scope, practise directly across domains, build meaningful mastery, and return where live evidence needs attention.
      FIRST VIEWPORT: Brand and Progress at top; continent scope choices below. Mobile stays simultaneous, thumb-friendly and low-friction.
      FORM: Operate surface; Tactile Atlas visual system; framework-free UI implementation.
      FINISH: review, validation, and implementation notes are part of the build.
    -->
    <div id="app"></div>
    <p id="live-status" class="visually-hidden" role="status" aria-live="polite"></p>
    <!--
      Visible counterpart to #live-status. Routine progress talk stays
      screen-reader-only above; anything the learner must actually see when an
      action does not complete (a round that could not load its geometry, an
      unrecognised country name) is rendered here instead. It sits outside
      #app so it survives the app's innerHTML re-render, and is its own live
      region so a message is seen and announced exactly once.
    -->
    <div id="app-notice" class="app-notice" role="status" aria-live="polite" hidden></div>
    <!--
      Persists across every route render (#app is fully replaced on
      navigation) because neither platform surfaces installability well on
      its own: Chrome's install affordance is a small omnibox glyph, and iOS
      Safari has no install prompt at all. Not a live region — it names an
      available action, not something that just happened.
    -->
    <div id="install-banner" class="install-banner" hidden></div>
    <script type="module" src="./src/map-viewport.ts"></script>
    <script type="module" src="./src/neighbor-map-runtime.ts"></script>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
