<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="Preview the experimental Spatial Atlas presentation for world geography learning." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!--
      iOS Safari does not honour the manifest's "display": "standalone" — it
      only launches chrome-free from the home screen when these proprietary
      tags are present. mobile-web-app-capable is the non-WebKit successor,
      kept alongside apple-mobile-web-app-capable rather than replacing it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas Spatial" />
    <link rel="stylesheet" href="./src/styles/styles.css" />
    <link rel="stylesheet" href="./src/styles/map.css" />
    <link rel="stylesheet" href="./src/styles/map-cartography.css" />
    <link rel="stylesheet" href="./src/styles/outline.css" />
    <link rel="stylesheet" href="./src/styles/neighbors.css" />
    <link rel="stylesheet" href="./src/styles/atlas-theme.css" />
    <link rel="stylesheet" href="./src/styles/spatial.css" />
    <title>Atlas Spatial Preview</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
