    <meta name="theme-color" content="#f6f8fb" />
    <meta name="description" content="A focused, adaptive way to learn world geography through flags, locations, outlines, and land-border neighbours." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <!--
      iOS Safari does not honour the manifest's "display": "standalone" — it
      only launches chrome-free from the home screen when these proprietary
      tags are present. mobile-web-app-capable is the non-WebKit successor,
      kept alongside apple-mobile-web-app-capable rather than replacing it.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />

    <link rel="stylesheet" href="./src/styles/map.css" />

    <link rel="stylesheet" href="./src/styles/atlas-theme.css" />
    <link rel="stylesheet" href="./src/styles/spatial.css" />

  </head>
