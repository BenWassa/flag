    <!--
      THESIS: Geography is the content; the interface is a tactile instrument around it.
      OWN-WORLD: Cool near-white canvas, graphite type, Atlas Blue actions, restrained squircles and shallow physical depth.
      STORY: Choose a learning domain and scope, practise directly, see learning evidence, and continue where recognition is weak.
      FIRST VIEWPORT: Brand and Progress at top; compact domain choices below. Mobile stays simultaneous, thumb-friendly and low-friction.
      FORM: Operate surface; Tactile Atlas visual system; framework-free implementation.
      FINISH: review, validation, and implementation notes are part of the build.
    -->
    <div id="app"></div>
    <p id="live-status" class="visually-hidden" role="status" aria-live="polite"></p>
    <script type="module" src="./map-viewport.js"></script>
    <script type="module" src="./neighbor-map-runtime.js"></script>
